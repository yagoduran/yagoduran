<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal: currently learning Python and Spring Boot">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; font-size: 20px; }
      .p { fill: #ff2bd6; } .c { fill: #00f0ff; } .t { fill: #e6e6ff; } .g { fill: #39ff88; } .d { fill: #8b8bb3; }
      .l { opacity: 0; animation: show 14s infinite; }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: 1.6s; } .l3 { animation-delay: 2.6s; }
      .l4 { animation-delay: 4.2s; } .l5 { animation-delay: 5.2s; } .l6 { animation-delay: 6.2s; }
      .l7 { animation-delay: 8s; }
      @keyframes show { 0% { opacity: 0 } 2% { opacity: 1 } 92% { opacity: 1 } 100% { opacity: 0 } }
      .cur { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
      .bar { animation: scan 2.4s ease-in-out infinite alternate; }
      .b2 { animation-delay: -1.2s; }
      @keyframes scan { from { transform: translateX(0) } to { transform: translateX(310px) } }
    </style>
  </defs>
  <rect width="900" height="300" rx="14" fill="#07071a"/>
  <rect width="900" height="38" rx="14" fill="#12122e"/>
  <rect y="24" width="900" height="14" fill="#12122e"/>
  <circle cx="26" cy="19" r="7" fill="#ff5f57"/><circle cx="50" cy="19" r="7" fill="#febc2e"/><circle cx="74" cy="19" r="7" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="d" style="font-size:14px">yago@dev: ~/learning</text>

  <g class="l l1"><text x="28" y="80"><tspan class="p">yago@dev</tspan><tspan class="t">:</tspan><tspan class="c">~</tspan><tspan class="t">$ </tspan><tspan class="t">cat learning.txt</tspan></text></g>
  <g class="l l2"><text x="28" y="115" class="d"># What I am learning right now</text></g>
  <g class="l l3"><text x="28" y="150"><tspan class="g">[python    ]</tspan><tspan class="t"> </tspan></text></g>
  <g class="l l4"><text x="28" y="185"><tspan class="g">[springboot]</tspan></text></g>
  <rect x="190" y="136" width="400" height="14" rx="7" fill="#1b1b40"/>
  <rect x="190" y="171" width="400" height="14" rx="7" fill="#1b1b40"/>
  <rect class="bar" x="190" y="136" width="90" height="14" rx="7" fill="url(#neon)"/>
  <rect class="bar b2" x="190" y="171" width="90" height="14" rx="7" fill="url(#neon)"/>
  <g class="l l5"><text x="28" y="225"><tspan class="p">yago@dev</tspan><tspan class="t">:</tspan><tspan class="c">~</tspan><tspan class="t">$ </tspan><tspan class="t">echo $LANGUAGES</tspan></text></g>
  <g class="l l6"><text x="28" y="255" class="c">spanish · basque · english · galician</text></g>
  <g class="l l7"><text x="28" y="285"><tspan class="p">yago@dev</tspan><tspan class="t">:</tspan><tspan class="c">~</tspan><tspan class="t">$ </tspan><tspan class="c cur">█</tspan></text></g>
</svg>
