<svg xmlns="http://www.w3.org/2000/svg" width="900" height="266" viewBox="0 0 900 266" role="img" aria-label="// SOBRE MÍ">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b1f"/><stop offset="1" stop-color="#05050d"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7c3aed" stroke-opacity=".18"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="266" rx="14" fill="url(#bg)"/>
  <rect width="900" height="266" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="264" rx="14" fill="none" stroke="url(#neon)" stroke-width="2"/>
  <text x="32" y="46" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="22" font-weight="800" fill="url(#neon)" filter="url(#glow)">// SOBRE MÍ</text>
  <rect x="32" y="58" width="60" height="3" rx="1.5" fill="#ff2bd6"><animate attributeName="width" values="60;220;60" dur="4s" repeatCount="indefinite"/></rect>
  <text x="32" y="100" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="400" fill="#e6e6ff" >Hola, soy Yago. Acabo de terminar DAM (Desarrollo de Aplicaciones Multiplataforma) y vengo</text>
  <text x="32" y="122" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="400" fill="#e6e6ff" >de Sistemas Microinformáticos y Redes, así que me muevo bien tanto en el código como en lo</text>
  <text x="32" y="144" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="400" fill="#e6e6ff" >que hay debajo: equipos, redes y sistemas.</text>
  <text x="32" y="180" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="400" fill="#e6e6ff" >Me gusta construir cosas que se usen de verdad: apps que funcionen bien, que se vean bien y</text>
  <text x="32" y="202" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="400" fill="#e6e6ff" >que alguien tenga ganas de abrir. Me flipa conectar una interfaz con sus datos y entender</text>
  <text x="32" y="224" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="400" fill="#e6e6ff" >qué pasa por dentro en cada paso.</text>
</svg>
