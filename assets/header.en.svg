<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Yago Duran - Cross-platform developer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#ff2bd6;#7c3aed;#00f0ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff2bd6"><animate attributeName="stop-color" values="#ff2bd6;#7c3aed;#00f0ff;#ff2bd6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b1f"/>
      <stop offset="1" stop-color="#05050d"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c3aed" stroke-opacity=".25" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050d" stop-opacity="1"/>
      <stop offset=".6" stop-color="#05050d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip">
      <rect x="0" y="190" height="40" width="0">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;.45;.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <rect width="900" height="280" rx="18" fill="url(#grid)">
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 30" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="280" rx="18" fill="url(#fade)"/>

  <circle cx="780" cy="70" r="60" fill="none" stroke="#00f0ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 10">
    <animateTransform attributeName="transform" type="rotate" from="0 780 70" to="360 780 70" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="70" r="38" fill="none" stroke="#ff2bd6" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 9">
    <animateTransform attributeName="transform" type="rotate" from="360 780 70" to="0 780 70" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-weight="800" text-anchor="middle">
    <text x="450" y="142" font-size="78" fill="#ff2bd6" opacity=".55">YAGO DURAN
      <animate attributeName="x" values="450;446;455;450;450" keyTimes="0;.02;.04;.06;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="142" font-size="78" fill="#00f0ff" opacity=".55">YAGO DURAN
      <animate attributeName="x" values="450;455;446;450;450" keyTimes="0;.02;.04;.06;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="142" font-size="78" fill="url(#neon)" filter="url(#glow)">YAGO DURAN</text>
  </g>

  <g clip-path="url(#typeclip)" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="24" fill="#e6e6ff">
    <text x="130" y="218">&gt; Cross-platform developer<tspan fill="#00f0ff"> _</tspan></text>
  </g>

  <rect x="0" y="0" width="900" height="3" fill="#00f0ff" opacity=".35">
    <animate attributeName="y" values="0;280" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="898" height="278" rx="18" fill="none" stroke="url(#neon)" stroke-width="2"/>
</svg>
